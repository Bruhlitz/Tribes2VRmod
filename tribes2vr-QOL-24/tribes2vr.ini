; Tribes2VR configuration -- build QOL-23
;
; READ THIS FIRST. It is the reason you lost a test cycle once already.
;
; Every line in this file OVERRIDES the build's own default, permanently, for
; every future build. Your old ini had "worldFarThreshold = 300" written into
; it by an early version of the mod. When I lowered the default to 100 to fix
; your virtual-screen problem, that stale line silently cancelled the fix and
; we both spent a build chasing it.
;
; So this file is deliberately SHORT. Anything not listed here uses the build's
; current default and will keep improving as the mod does. Do not paste in a
; long ini "for completeness" -- every extra line is a future fix you have
; opted out of without knowing it.
;
; Replace your existing C:\Dynamix\Tribes2\GameData\tribes2vr.ini with this.
;
; QOL-11: as of this build, a handful of live hotkeys (grip offset, hand
; presets, arm/weapon scale, the right-hand barrel lock) now WRITE BACK into
; this exact file the moment you press them - so if you see lines appear or
; change on their own with a "QOL-11: auto-saved by a live hotkey" comment,
; that's expected: it's this mod remembering what you dialled in, not
; something else editing your file. The flip side: a stray keypress now
; sticks permanently too, not just for the session - so if a hand looks
; wrong after playing, check the bottom of this file for a value that
; doesn't look like something you meant to set before assuming a build
; regressed.

; --- the things you actually want on ---------------------------------------
enabled       = true
vrCameraMode  = true
stereoMode    = 2        ; 2 = depth stereo, the real VR depth
worldScale    = 0.6      ; depth strength; higher = world looks SMALLER
                         ; QOL-15: lowered from 1.0. At 1.0 the QOL-14 log
                         ; measured the near field at 1.55 deg of disparity
                         ; (and the gun pinned against the 3.00 deg cap),
                         ; and near-field disparity is exactly what the
                         ; reprojection has to invent pixels for - which is
                         ; the edge smearing. 0.6 is about two and a half
                         ; presses down the numpad-minus track. Numpad +/-
                         ; still moves it live if you want more or less.
motionDefault = true     ; motion controls on at launch (F2 toggles)

; --- your body, the only numbers that are personal to you -------------------
; Your own shoulder-to-hand reach in metres. If the avatar over-reaches lower
; it; if it under-reaches raise it. 0.62 is an average adult.
armPlayerMetres = 0.62

; Which of the 24 possible orientations the model's left hand node wants.
; You measured this: 10. It is also the build default now, so this line is
; only here so you can re-sweep with F5/F1 and pin a new one if the wrist
; change shifts it.
handLeftPreset  = 10

; --- QOL-12: THE RIGHT HAND MESH FINALLY HAS ITS OWN DIAL --------------------
; You said it exactly right: "the shift + f5 was for the weapon not the
; wrist. none of those buttons moved the wrist/hand they just moved the
; weapon." That is the bug, in one sentence, and it was the bug for ten
; builds. handRightPreset (RShift+F1/F5) is composed into node 15, which is
; mountPointNode[0] - the WEAPON MOUNT. An old comment in the source calls
; node 15 "RIGHT HAND" because that's where the gun hangs, and I read that
; label as meaning the hand mesh. It doesn't. The visible hand geometry is
; on node 14, which had NO correction applied to it at all - so all 24
; presets you swept were rotating the gun and never once touched your hand.
;
; Worse, node 14 was being handed a rotation built on node 15's rest basis
; (its own rest rotation was never even captured - only 12, 13 and 15 were).
; A wrist bone and a weapon mount point are ~90 degrees apart by
; construction in most rigs, which is precisely "my hand is facing palm
; forward and stuck entirely to the right." Node 14 now gets the world-space
; rotation delta applied to ITS OWN rest basis, which is the correct way to
; drive two different bones from one motion.
;
; This is node 14's own orientation dial - RCtrl+F1 / RCtrl+F5 (note RCtrl,
; NOT RShift - RShift still moves the gun). Defaults to 10, the value
; already measured correct for the left hand's mesh, since both hands'
; bones in one skeleton normally share a local axis convention.
handWristPreset   = 0

; QOL-15: the weapon size the player settled on after dialling it in live.
weaponScale       = 0.55
; handWristRollDeg  = 0.0
; handWristPitchDeg = 0.0
; handWristYawDeg   = 0.0

; DELIBERATELY ABSENT, and they should stay absent:
;   worldFarThreshold  - this is what broke you; the build now handles it
;   frustumMode, headTracking, all depth tuning, every key binding
;   every aim / turn / deadzone value
;   ALL SIX ACTION COMMANDS - see below
; If one of them ever genuinely needs changing I will tell you the single line
; to add, and why.
;
; armScale used to be on this "leave alone" list ("must stay 1.0 for true
; 1:1"). QOL-4 makes it an intentional live-tunable instead - see the QOL-4
; section below for why, and Insert/Delete to dial it in-headset.

; --- action buttons: NOTHING TO SET HERE ANY MORE ---------------------------
; The six action commands used to live in this file as editable strings,
; because I did not know the right script names and was guessing. That is
; over. BINDS-1 read this install's own moveMap and reported exactly what
; Tribes 2 runs for each key, and those real names are now baked into the
; build as defaults:
;
;   grenade    throwGrenadeMax     (your 't' key)
;   mine       placeMine           (your 'f' key)
;   pack       useBackPack         (your 'r' key)
;   health     useRepairKit        (your 'q' key)
;   weapons    cycleWeaponAxis     (your mouse wheel)
;   inventory  numpad Enter, sent with the EXTENDED key flag
;
; The build now logs all six at startup under "Config: ACTION COMMANDS", so
; what is actually running is always visible without opening this file.
;
; Only if one of them misbehaves, these are the override keys:
;   cmdGrenade / cmdMine / cmdPack / cmdHealth
;   cmdWeaponNext / cmdWeaponPrev
;   invVirtualKey / invKeyExtended / cmdInventory
;
; The one alternative worth knowing: if numpad Enter does not open the
; inventory, this switches to pushing the panel directly instead, which is a
; genuinely different route rather than another guess at a name:
;
; cmdInventory = if (InventoryScreen.isAwake()) Canvas.popDialog(InventoryScreen); else Canvas.pushDialog(InventoryScreen);

; --- button-to-bit map, for reference ---------------------------------------
; Read off your own probe lines rather than a mapping table:
;   bit 7 = A (right) / X (left)      bit 1 = B (right) / Y (left)
;   bit 32 = thumbstick click         bit 2 = grip      bit 33 = trigger
; Only change these if a button does the wrong thing.
;
; btnGrenadeBit   = 7      ; A  (right)
; btnMineBit      = 1      ; B  (right)
; btnPackBit      = 7      ; X  (left)
; btnHealthBit    = 1      ; Y  (left)
; btnMenuBit      = 32     ; left thumbstick click  -> Esc
; btnInventoryBit = 32     ; right thumbstick click -> inventory
; weaponCycleAxis = 0.6    ; how far up/down the right stick counts as a press

; --- laser pointer for 2D menus ---------------------------------------------
; Alive ONLY on frames a menu panel is being drawn - including the inventory
; screen, as of INVENTORY-1. In the world it does nothing, so it can never
; move the mouse under you mid-fight.
;
; laserEnabled   = true
; laserRightHand = true    ; false to point with the left hand
; laserClickAxis = 0.6     ; trigger travel that counts as a click
;
; THE ONE YOU MAY NEED. The controller's reported forward runs out of the TOP
; of the device, tens of degrees off the way you think you are pointing, so the
; ray is tilted down by this much to come out of the front instead.
; If the cursor sits ABOVE where you are pointing, raise it. Below, lower it.
; laserPitchDeg  = 45

; --- performance (PERF-1) ----------------------------------------------------
; How many rendered frames pass between depth reads. Colour is always every
; frame; this only ages the depth used for the second eye. 1 = old behaviour.
; depthCaptureEveryNFrames = 2

; --- QOL-1: all commented out = build defaults. Each is a one-line revert. -----
; The menu panel is now a SteamVR overlay placed by the compositor itself.
; menuOverlay   = true     ; false = the old self-drawn quad
; menuCurvature = 0.0      ; 0.1-0.2 wraps the panel gently around you
; menuFlipV     = false    ; true only if the overlay comes up upside down
;
; The game's own health/energy/ammo HUD is moved into the part of the frame
; both eyes can see, and the mod's backup health bar sits bottom-centre.
; hudRelocate   = true
; healthBar     = true
;
; Hands anchored at the avatar's eye, one metre for one metre.
; armAnchorEye  = true     ; false = the previous shoulder/reach-ratio anchor

; --- QOL-2: the grip, relative to the controller's tracked origin -----------
; Dial live: PageUp/PageDown along the pointing axis, Home/End along the
; controller's up axis, 1 cm a press; the log prints the numbers. Once the
; gun sits in your hand, send them and they become the build default.
; handGripForward = 0.08
; handGripUp      = 0.0

; --- QOL-3: HUD margin + menu reading distance -------------------------------
; The QOL-2 test log caught weaponsHud placed exactly flush against the
; visible region's own corner - technically still inside the crop, but right
; where a headset's lens periphery is softest. This pulls every HUD element
; in from all four edges by this fraction of the visible region. 0 = old
; flush-edge behaviour; raise it if ammo/health still feel edge-clipped.
; hudMarginPct = 0.12

; Distance to the menu panel, in metres. This does NOT change how big the
; menu looks (that's screenFovDeg below, unchanged) - only how far away it
; sits, which changes how hard your eyes have to converge on it. Farther is
; generally easier to read. Was 2.5, now 3.0.
; screenDistance = 3.0

; The menu can also be curved instead of flat, which keeps its edges as
; close to you as its centre and can make edge text easier to focus on - but
; the laser pointer assumes a flat panel, so it left at 0 by default. Try
; 0.1-0.2 if you want to experiment; drop it back to 0 if the pointer feels
; off near the edges.
; menuCurvature = 0.0

; --- QOL-4: the grip offset was quietly stretching your arm --------------
; Your QOL-2 log explains "PageUp/PageDown felt like it was making my arms
; longer or shorter": the grip offset was added BEFORE the arm-length scale,
; so it got multiplied by the same factor that scales your whole reach onto
; the avatar's longer arm. Fixed - the grip offset is now applied AFTER that
; scale, so it stays a small fixed nudge regardless of arm length. Two
; separate, independent live dials now:
;
;   PageUp/PageDown, Home/End   grip offset (small, ~centimetres) - palm vs
;                               wrist, exactly what it was meant to do
;   Insert/Delete               armScale (reach length) - now an intentional
;                               player preference, not a bug workaround
;   [ / ]                       weaponScale (gun size)
;
; Your QOL-2 test swept handGripForward from -0.27 to +0.15 chasing what
; felt like arm-length changes - once this fix is in, re-sweep it in a much
; smaller range (probably +/-0.05 to +/-0.10) since it will actually behave
; like a grip nudge this time.
handGripForward = -0.02
handGripUp      = -0.18
handGripRight   = 0.02
; armScale      = 1.0

; "the gun definitely needs to be smaller, maybe like 20%" - scales only the
; hand/weapon node, not the wrist or the arm's reach math.
; weaponScale = 0.8

