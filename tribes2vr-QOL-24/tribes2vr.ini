; --- QOL-7: health finally has a real hypothesis, plus energy -------------
; getDamagePercent() read back exactly 1.0 on EVERY poll across six builds
; and test sessions of active play - a real damage value moves with combat;
; a value that never moves is the assumption about its meaning being wrong,
; not the reading. Flipped: it's now treated as HEALTH already, not damage
; to invert. A real hit should now visibly drop the number; if it stays
; pinned at 100% even after being shot, that's useful evidence for next time.
; energyBar adds a second, cyan bar stacked right above health - same
; screen-space, head-locked technique (it was already "stuck to your face,
; moves with your head" from the start; the bug was always the value, not
; the position).
; healthBar = true
; energyBar = true

; --- QOL-8: the grip offset was being eaten by the arm's own reach clamp ---
; Your QOL-6 test log found the real bug: "avatar asked for 1.32 units,
; allowed 0.19..0.95, got 0.95 <-- CLAMPED, out of reach" while you were
; dialling handGripUp/Right further and further trying to get a reaction.
; The grip offset used to be baked into the SAME point the arm's two-bone IK
; solves for and clamps to your physical reach - so once your arm was
; already near full extension (normal for holding a rifle out in front of
; you), any further offset just got silently rescaled back to the reach
; limit. The "ask" kept growing every press; the render never moved. That is
; exactly "none of these presses seemed to do anything."
;
; Fixed: the grip offset is now applied to the WEAPON's own mount point only,
; after the arm has already been solved and clamped - it never competes with
; your arm's reach limit again, and moving it should visibly move the gun
; now regardless of how extended your arm is.
;
; Live dial keys are unchanged: PageUp/PageDown, Home/End, Left/Right arrows.
; They are now also clamped to +/-0.30m each so a "no effect" chase like the
; QOL-6 one can't run them off to unreasonable values (yours reached -0.52m
; on handGripUp) while hunting for a fix that wasn't there yet.

; --- QOL-9: health/energy were STILL using the broken ternary, plus the ----
; --- right hand's real rotation problem, finally isolated ------------------
; Your QOL-8 log showed health and energy both pinned at exactly 100.0% no
; matter what happened, right next to "HUD-7b health diag: class = 1 |
; getDamageLevel() = 1" - two different queries collapsing to the same
; value again. Root cause: HealthPercent()/EnergyPercent() were still using
; "isObject(x) ? x.method() : -1" - a method call wrapped in a ternary -
; which is the exact parser bug the HUD-7b diagnostic itself was fixed for
; two builds ago. That fix never got backported to the functions the
; diagnostic exists to explain. Now fixed the same way everywhere: a bare
; isObject() check first, then a bare, unconditional method call.
; healthBar = true
; energyBar = true
;
; THE RIGHT HAND: found the structural reason no preset ever fixed it.
; The left hand's rotation is just "follow your real wrist" plus one FIXED
; cosmetic correction (handLeftPreset) - which is why a single preset was
; enough. The right hand gets a SECOND rotation on top of that, every single
; frame: a forced twist that keeps the gun's barrel pointed exactly at the
; server's own computed shot direction (body yaw/pitch), so the visible gun
; can never lie about where the bullet goes. That twist changes with your
; aim, so no static preset can ever cancel it - which is exactly why
; sweeping all 24 values never worked for the right hand the way it did for
; the left.
;
; handRightBarrelLock = true is that twist, unchanged default behaviour.
; Toggle it live with RShift+F9, or set it here:
; handRightBarrelLock = false
;
; With it off, your right hand should finally follow your real wrist the
; same way your left hand does. The trade: the gun model may occasionally
; point slightly off from where the shot actually lands, since the shot was
; never derived from the gun model's rotation to begin with (only from body
; yaw/pitch - see the "THE BARREL TELLS THE TRUTH" comment in the code).
; Test both ways and tell me which looks and feels more like actually
; holding the weapon - that answer decides whether this becomes the new
; default, or whether the barrel-lock needs to be smarter instead of
; removed outright.

; --- QOL-10: the right hand's REAL structural bug, found -------------------
; Your QOL-9 test found the barrel-lock toggle wasn't the fix - the wrist
; still looked broken with it off. That sent me back to the left hand's own
; code, which already documents (and already fixed, in an earlier build) the
; exact bug you were describing: "the hand's rotation was taken straight
; from the controller while the forearm was placed by the IK, with nothing
; linking the two... shear at the wrist joint... looks like a broken wrist."
; That fix (the hand RIDES the forearm, with your controller only allowed to
; twist it away by a real wrist's range) was never ported to the right hand,
; which computed its rotation an entirely different, older way. It now uses
; the exact same mechanism as the left hand:
;
;   wristFollowForearm = true    (shared by both hands, unchanged default)
;   wristLimitDeg       = 60.0   (shared by both hands, unchanged default)
;
; handRightPreset and handRightBarrelLock both still apply on top of this,
; unchanged in meaning.
;
; A LEFT-HAND NOTE: your QOL-9 log shows handLeftPreset drifted from 10 to
; 11 partway through that session (a stray F5 press, most likely - RShift+F9
; was also being pressed a lot in that same session for the barrel-lock
; toggle, and it's an easy slip to land on plain F5/F1 instead). That is
; very likely why the left hand suddenly looked broken after having been
; fine for builds - nothing in QOL-9's code touched the left hand at all.
; This ini pins it back to your confirmed-good handLeftPreset = 10 above;
; if the left hand looks wrong again, check the log for a stray "LEFT HAND
; ORIENTATION" line before assuming a regression.

; --- QOL-11: hotkeys finally save themselves ---------------------------------
; "my grip position is not carried over from last test" was a real gap, not
; a fluke: every live-tunable hotkey (grip offset, both hand presets,
; armScale/weaponScale, the barrel lock) only ever changed an in-memory
; value - nothing was written back to this file, ever, so every relaunch
; quietly threw away whatever you'd just dialled in. That's fixed now: each
; of those hotkeys writes its own value straight back into this ini the
; moment you press it. You should never have to re-nudge the same setting
; twice across a relaunch again. See the note near the top of this file for
; what that looks like when it happens.
;
; Since the right hand's rotation math changed structurally in QOL-10 (it
; now rides the forearm instead of the raw controller), your old
; handRightPreset value was found against the OLD math and may not be the
; right one anymore - please re-sweep it with RShift+F1/F5 this time. It
; will stick permanently once you land on one, so this should be the last
; time you need to.
